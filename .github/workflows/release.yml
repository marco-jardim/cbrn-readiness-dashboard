name: Release

# Runs only when a version tag is pushed. Four jobs:
#   build   - read-only. Runs the tests, then the packaging tests, which build the one-folder
#             bundle into dist/ (the two CBRN_BUNDLE_* variables) and run its frozen self-test.
#             The tested folder is uploaded as the workflow artefact "cbrn-dashboard-bundle-...".
#             There is no second build.
#   sign    - optional, read-only. Runs only when the repository variable SIGNPATH_ORGANIZATION_ID
#             is not empty. It sends that artefact to SignPath (free code signing for open-source
#             projects, SignPath Foundation), waits for the manual approval, checks the Authenticode
#             signature of cbrn-dashboard.exe and its frozen self-test, and uploads the signed
#             folder. Only cbrn-dashboard.exe is signed (.signpath/artifact-configurations). While
#             the variable is empty this job is skipped and the release is unsigned, as before.
#             The signing action lives in its own job on purpose: GitHub fetches every action of a
#             job when the job starts, so a skipped job never touches it.
#   package - read-only. Downloads the signed folder when "sign" ran, otherwise the unsigned one.
#             The zip and the per-user installer (Inno Setup 6, preinstalled on the image) are made
#             from that very folder, so both are the bundle that was tested (and signed). The
#             installer is built, smoke-tested (silent install, frozen self-test, silent uninstall
#             that keeps the data) and checksummed on EVERY release, automatically; a failure of
#             any of these steps fails the release. The zip, the installer, the checksum files and
#             the release notes are uploaded as one workflow artefact.
#   release - the only job with write permissions. It downloads that artefact, attests the build
#             provenance of the zip and of the installer and creates a DRAFT release with both. It
#             installs no dependency and runs no project code.
# Nothing is published here: a person publishes the draft after a manual smoke test of the zip on
# a clean Windows machine.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle-artifact-id: ${{ steps.upload-bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"

      - run: uv sync --locked --all-groups

      # The tag goes through an environment variable, never straight into the script text.
      - name: Check that the tag is v plus the package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/make_release_zip.py check-tag --tag "$env:TAG"

      # The package version (the tag has just been checked against it) is the version parameter of
      # the SignPath artifact configuration.
      - name: Read the package version
        id: version
        shell: pwsh
        run: |
          $version = "$(uv run python scripts/make_release_zip.py print-version)".Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "print-version failed" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Default test suite
        run: uv run pytest

      # The packaging tests build the bundle into dist/ and build/; the zip is made from it.
      - name: Packaging test suite
        run: uv run pytest -m packaging
        env:
          CBRN_BUNDLE_DIST_DIR: dist
          CBRN_BUNDLE_WORK_DIR: build

      # The folder itself, not a zip of it: the root of the artefact must hold cbrn-dashboard.exe
      # and _internal/, which is what the SignPath artifact configuration expects. The name is
      # unique per run and attempt.
      - name: Upload the tested bundle folder
        id: upload-bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbrn-dashboard-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/cbrn-dashboard
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  sign:
    needs: build
    # Signing is off until the owner sets the repository variable SIGNPATH_ORGANIZATION_ID (see
    # CODE-SIGNING-POLICY.md and docs/architecture.md). While it is empty this job is skipped.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-2025
    # The job waits for the manual approval in SignPath: the timeouts below are generous.
    timeout-minutes: 150
    # Read-only: "actions: read" lets the SignPath action read the artefact of this run.
    permissions:
      contents: read
      actions: read
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      signed: ${{ steps.mark-signed.outputs.signed }}
    steps:
      # Pinned to the commit of the tag v3.0 (git ls-remote, 2026-11-13); the input names were
      # checked against the action.yml of that tag.
      - name: Submit the signing request to SignPath and wait for the approval
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.bundle-artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist-signed/cbrn-dashboard

      # Fails the job unless the executable carries a valid Authenticode signature and the signed
      # executable still starts (the frozen self-test the packaging tests also run).
      - name: Check the signature and the self-test of the signed executable
        shell: pwsh
        run: |
          $exe = 'dist-signed/cbrn-dashboard/cbrn-dashboard.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Output "Status: $($signature.Status); signer: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "cbrn-dashboard.exe has no valid signature" }
          $data = Join-Path $env:RUNNER_TEMP 'signed-self-test'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test', '--data-dir', $data -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the signed executable failed its self-test" }

      - name: Upload the signed bundle folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbrn-dashboard-bundle-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-signed/cbrn-dashboard
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      # Last step: "signed" is true only when everything above succeeded.
      - name: Mark the bundle as signed
        id: mark-signed
        shell: pwsh
        run: '"signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

  package:
    needs: [build, sign]
    # "sign" is skipped (unsigned release) or succeeded; a failed or cancelled "sign" stops here.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"

      - run: uv sync --locked --all-groups

      # Exactly one of the two downloads runs; both put the folder in bundle/, so the steps below
      # are the same for a signed and an unsigned release.
      - name: Download the unsigned bundle folder
        if: ${{ needs.sign.outputs.signed != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbrn-dashboard-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle

      - name: Download the signed bundle folder
        if: ${{ needs.sign.outputs.signed == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbrn-dashboard-bundle-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle

      # The per-user installer is built from that same folder on every release, automatically: no
      # person builds or uploads it. Inno Setup 6 is preinstalled on the windows-2025 image
      # (nothing is downloaded); scripts/build_installer.py fails when ISCC.exe is missing.
      - name: Build the installer from the bundle folder
        run: uv run python scripts/build_installer.py --bundle-dir bundle --out-dir release

      - name: Zip the bundle and write the checksum files
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path release -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one setup file in release/, found $($setup.Count)" }
          uv run python scripts/make_release_zip.py package --bundle-dir bundle --out-dir release --installer $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "package failed" }

      # Silent install into a temporary folder, the frozen self-test of the installed program,
      # silent uninstall; the data folder must survive. A failure here fails the release.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path release -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one setup file in release/, found $($setup.Count)" }
          & ./scripts/smoke_installer.ps1 -Setup $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "the installer smoke test failed (exit code $LASTEXITCODE)" }

      - name: Write the release notes and the prerelease flag
        shell: pwsh
        env:
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          $zip = (Get-ChildItem -Path release -Filter '*.zip').FullName
          $setup = (Get-ChildItem -Path release -Filter '*-setup.exe').FullName
          $signedFlag = @()
          if ($env:SIGNED -eq 'true') { $signedFlag = @('--signed') }
          uv run python scripts/make_release_zip.py release-body --template .github/release-body.template.md --out release/body.md --zip $zip --installer $setup @signedFlag
          if ($LASTEXITCODE -ne 0) { throw "release-body failed" }
          $pre = uv run python scripts/make_release_zip.py prerelease-flag
          if ($LASTEXITCODE -ne 0) { throw "prerelease-flag failed" }
          Set-Content -Path release/prerelease.txt -Value "$pre" -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbrn-dashboard-release
          path: release
          retention-days: 14
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    # Elevated permissions are granted to this job only (top level stays read-only). It has no
    # checkout and installs nothing: it only receives the artefact of the package job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The artefact the package job of this very run uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbrn-dashboard-release
          path: release

      # Both downloads of the release: the zip and the installer.
      - name: Attest the build provenance of the zip and the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*-setup.exe

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = (Get-ChildItem -Path release -Filter '*.zip').FullName
          $setup = @(Get-ChildItem -Path release -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one setup file in release/, found $($setup.Count)" }
          $pre = (Get-Content -Path release/prerelease.txt -Raw).Trim()
          $arguments = @($env:TAG, $zip, $setup[0].FullName, 'release/SHA256SUMS.txt', 'release/SHA256-FILES.txt')
          $arguments += @('--draft', '--title', "CBRN Readiness Dashboard $env:TAG", '--notes-file', 'release/body.md')
          if ($pre) { $arguments += $pre }
          gh release create @arguments
