name: Release

# Runs only when a version tag is pushed. Two jobs:
#   build   - read-only. Runs the tests, then the packaging tests, which build the one-folder
#             bundle into dist/ (the two CBRN_BUNDLE_* variables) and run its frozen self-test.
#             The zip is made from that very folder, so the zip is the bundle that was tested.
#             There is no second build. The zip, the checksum files and the release notes are
#             uploaded as one workflow artefact.
#   release - the only job with write permissions. It downloads that artefact, attests the build
#             provenance of the zip and creates a DRAFT release. It installs no dependency and
#             runs no project code.
# Nothing is published here: a person publishes the draft after a manual smoke test of the zip on
# a clean Windows machine.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"

      - run: uv sync --locked --all-groups

      # The tag goes through an environment variable, never straight into the script text.
      - name: Check that the tag is v plus the package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/make_release_zip.py check-tag --tag "$env:TAG"

      - name: Default test suite
        run: uv run pytest

      # The packaging tests build the bundle into dist/ and build/; the zip below is made from it.
      - name: Packaging test suite
        run: uv run pytest -m packaging
        env:
          CBRN_BUNDLE_DIST_DIR: dist
          CBRN_BUNDLE_WORK_DIR: build

      - name: Zip the tested bundle and write the checksum files
        run: uv run python scripts/make_release_zip.py package --bundle-dir dist/cbrn-dashboard --out-dir release

      - name: Write the release notes and the prerelease flag
        shell: pwsh
        run: |
          $zip = (Get-ChildItem -Path release -Filter '*.zip').FullName
          uv run python scripts/make_release_zip.py release-body --template .github/release-body.template.md --out release/body.md --zip $zip
          if ($LASTEXITCODE -ne 0) { throw "release-body failed" }
          $pre = uv run python scripts/make_release_zip.py prerelease-flag
          if ($LASTEXITCODE -ne 0) { throw "prerelease-flag failed" }
          Set-Content -Path release/prerelease.txt -Value "$pre" -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbrn-dashboard-release
          path: release
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    # Elevated permissions are granted to this job only (top level stays read-only). It has no
    # checkout and installs nothing: it only receives the artefact of the build job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The artefact the build job of this very run uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbrn-dashboard-release
          path: release

      - name: Attest the build provenance of the zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = (Get-ChildItem -Path release -Filter '*.zip').FullName
          $pre = (Get-Content -Path release/prerelease.txt -Raw).Trim()
          $arguments = @($env:TAG, $zip, 'release/SHA256SUMS.txt', 'release/SHA256-FILES.txt')
          $arguments += @('--draft', '--title', "CBRN Readiness Dashboard $env:TAG", '--notes-file', 'release/body.md')
          if ($pre) { $arguments += $pre }
          gh release create @arguments
