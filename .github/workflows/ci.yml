name: CI

# Pushes run CI on the main branch only. Every other branch (Dependabot's included) is covered by
# its pull request, so it is not tested twice, and a tag push (a release) never starts CI: the
# release workflow runs the tests itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.11.7"

      - run: uv sync --locked --all-groups

      - run: uv run pytest --cov=cbrn_dashboard.domain --cov=cbrn_dashboard.storage --cov=cbrn_dashboard.services --cov-report=term-missing

      # Coverage gate (PLAN section 9): at least 90% for domain, storage and services, applied
      # only in CI. It switches on by itself as soon as the first of those packages exists
      # (Phase 1). It is a separate step so that the test suite runs only once.
      - if: ${{ hashFiles('src/cbrn_dashboard/domain/*.py', 'src/cbrn_dashboard/storage/*.py', 'src/cbrn_dashboard/services/*.py') != '' }}
        run: uv run coverage report --fail-under=90

  # One-folder Windows bundle (PLAN section 8): the packaging tests build it, run its frozen
  # --self-test and inspect its contents. They build into dist/ and build/ (the two CBRN_BUNDLE_*
  # variables below), and the zip is made from that very folder: the uploaded bundle is the one
  # whose self-test ran. There is no second build.
  build:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.11.7"

      - run: uv sync --locked --all-groups

      - run: uv run pytest -m packaging
        env:
          CBRN_BUNDLE_DIST_DIR: dist
          CBRN_BUNDLE_WORK_DIR: build

      - run: Compress-Archive -Path dist/cbrn-dashboard -DestinationPath cbrn-dashboard-win-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbrn-dashboard-win-x64
          path: cbrn-dashboard-win-x64.zip
          retention-days: 14
          if-no-files-found: error
