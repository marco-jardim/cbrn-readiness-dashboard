version: 2

updates:
  # GitHub Actions. Dependabot keeps the full-SHA pins of the workflows and rewrites the
  # trailing "# vX.Y.Z" comment, which can go stale. The reviewer of each actions update checks
  # the new SHA against a tagged release (PLAN T9.5). Every update pull request runs CI,
  # including the packaging job, before it can be merged.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  # Python dependencies: pyproject.toml and uv.lock.
  # The constraint PySide6>=6.8,<6.13 in pyproject.toml is deliberate while Windows 10 is a
  # target: Qt 6.12 is the last Qt release that supports it (PLAN K17). Dependabot must not
  # widen it. 6.13 is a minor release, so a semver-major rule would not hold it back; the
  # PySide6 family is ignored from 6.13 on instead. The yearly stack review revisits this.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      - dependency-name: "pyside6"
        versions: [">=6.13"]
      - dependency-name: "pyside6-essentials"
        versions: [">=6.13"]
      - dependency-name: "pyside6-addons"
        versions: [">=6.13"]
      - dependency-name: "shiboken6"
        versions: [">=6.13"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
