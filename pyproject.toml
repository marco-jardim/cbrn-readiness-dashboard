[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cbrn-readiness-dashboard"
dynamic = ["version"]
description = "Desktop dashboard for hospital CBRN readiness."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<6.13",
]

[project.gui-scripts]
cbrn-dashboard = "cbrn_dashboard.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]
build = [
    "pyinstaller>=6.10",
]

[tool.hatch.version]
path = "src/cbrn_dashboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cbrn_dashboard"]
